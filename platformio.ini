[env:NerdminerV2]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:auto_firmware_version.py
    post:post_build_merge.py
board_build.f_cpu = 240000000L 
