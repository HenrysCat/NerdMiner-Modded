	-DUSE_HSPI_PORT=1
	-DLOAD_GLCD=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=16000000
