[env:ESP32-2432S028R]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
extra_scripts =
    pre:auto_firmware_version.py
    post:post_build_merge.py
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
	colorize
	;debug
upload_speed = 921600
;build_type = debug
board_build.partitions = huge_app.csv
; -O3 instead of the Arduino default -Os: measured +3% on the HW SHA core
; (HW counter ~640 -> ~660 KH/s, hit-based 631-637 -> 650 over 10 min runs).
build_unflags = -Os
build_flags =
	-O3
	-funroll-loops
	;-DDEBUG_MEMORY=1
	; Uncomment both to A/B test HW-SHA vs SW-only mining and print a
	; per-second HW/SW0/SW1 hashrate breakdown to the serial monitor.
	; With PIPELINED_ASM_MINING, DEBUG_MINING also prints [PLDBG]
	; hits/real/mismatch/accepted counters -- the in-firmware integrity
	; check (require mismatch=0 AND real==hits; hits * 65536 / seconds is
	; the true HW hashrate). Changes to the asm schedule itself go through
	; the bench first: see src/pipelined_hw_sha_classic_v2.S.
	; It also prints [CHUNKGAP] (per-job-chunk dead time outside the hot
	; loop) and [HITOVERHEAD] (per-candidate SW-reverify dead time inside
	; a chunk) -- both measured negligible (~0.02-0.03% and ~0.04-0.075%
	; of total time respectively) when this was used to investigate a
	; sustained-vs-peak throughput gap; see mining.cpp for the counters.
	;-D DEBUG_MINING=1
	;-D FORCE_SW_MINING=1
	; Pipelined-asm classic-ESP32 HW mining loop (see mining.h /
	; src/pipelined_hw_sha_classic_v2.S) instead of the plain-C one.
	; Uncomment DEBUG_MINING above too for the hit/mismatch/accepted
	; diagnostic counters used to validate it.
	-D PIPELINED_ASM_MINING=1
	; Arduino's own loopTask (which runs webConfigProcess(), i.e. the LAN
	; settings page) defaults to core ARDUINO_RUNNING_CORE, which the
	; framework defines to 1 (see cores/esp32/esp32-hal.h). minerWorkerHw
	; is pinned to core 1 at priority 19 specifically so it always
	; preempts everything else there (see its xTaskCreatePinnedToCore call
	; in NerdMinerV2.ino.cpp) -- but since the pipelined hot loop never
	; voluntarily yields while a job is queued, that isn't "usually wins",
	; it's *complete, permanent starvation* of core 1's loopTask, i.e. the
	; web UI is unreachable (measured on hardware: HTTP requests to it
	; time out at 15s+) for the entire time mining is active, not just
	; slow. Overriding to core 0 here moves loopTask in with Monitor/
	; Stratum/the WiFi driver task/the second SW miner, all of which
	; already cooperatively yield via vTaskDelay, so it gets fair
	; scheduling instead of zero. Doesn't touch core 1 or the miner's
	; priority, so measured hashrate is unaffected.
	-D ARDUINO_RUNNING_CORE=0
	; Second, previously-missed instance of the exact same problem: the
	; Arduino-ESP32 framework also spins up its OWN internal task
	; ("arduino_events", WiFiGeneric.cpp) to dispatch WiFi.onEvent()
	; callbacks (DHCP, (re)connect/disconnect, etc.). It defaults to
	; ARDUINO_EVENT_RUNNING_CORE = core 1 (Kconfig.projbuild:
	; ARDUINO_EVENT_RUN_CORE1 is the non-unicore default) AND priority
	; ESP_TASKD_EVENT_PRIO-1 = 19 -- the exact same core AND exact same
	; priority as minerWorkerHw, so unlike loopTask (fully starved, below
	; it in priority) this one round-robin TIME-SLICES against the miner
	; on every WiFi event. It's normally blocked on an empty queue
	; (portMAX_DELAY), so steady-state cost is ~zero, but it wakes on
	; every reconnect/DHCP-renewal/RSSI event -- exactly when
	; checkPoolConnection()'s retry path or a flaky link would otherwise
	; already be hurting hashrate, compounding it. Confirmed independently:
	; BitsyMiner's own README lists "Events Run on Core 0" as a required
	; Arduino IDE board setting, i.e. its author hit and fixed this same
	; issue. Moving it here for the same reason as ARDUINO_RUNNING_CORE
	; above -- core 0 already runs the mandatory WiFi driver task, so this
	; is its natural home, not a new contention point.
	-D ARDUINO_EVENT_RUNNING_CORE=0
	-D ESP32_2432S028R=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=12
	-DTFT_BL=21
	-DETOUCH_CS=33
	-DTOUCH_CLK=25
	-DTOUCH_MISO=39
	-DTOUCH_MOSI=32
	-DTOUCH_IRQ=36
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	
lib_deps = 
	https://github.com/takkaO/OpenFontRender#v1.2
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	mathertel/oneButton@^2.6.1
	arduino-libraries/NTPClient@^3.2.1
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/achillhasler/TFT_eTouch
lib_ignore =
	HANSOLOminerv2

