; LCDWiki ES3C35P (also sold rebadged, e.g. Hosyond): ESP32-S3, 16MB flash,
; 8MB octal PSRAM, native USB, 3.5" 320x480 ST77922 panel on quad SPI with
; built-in touch. Runs the Pulse theme at 480x320
; (src/drivers/displays/es3c35pDisplayDriver.cpp).
; Not in default_envs; build it explicitly:
;   pio run -e ES3C35P -t upload
[env:ES3C35P]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:auto_firmware_version.py
    post:post_build_merge.py
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
	colorize
; Native USB port. esptool's flasher stub (v4.5.1) regularly stops answering
; on this board ("No serial data received" right after "Stub running");
; the ROM loader does not, and is about as fast over USB.
upload_speed = 115200
upload_flags = --no-stub
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
build_flags =
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ES3C35P=1
	;-D DEBUG_MINING=1
	; Overlapped HW SHA loop for the S3 (s3_pl_mine in mining.cpp): measured
	; 324 KH/s against 222 for the stock loop on this board. With it the HW
	; miner gets core 1 to itself and everything else runs on core 0, hence
	; the two core flags (see env:ESP32-2432S028R for the reasoning).
	-D PIPELINED_S3_MINING=1
	-D ARDUINO_RUNNING_CORE=0
	-D ARDUINO_EVENT_RUNNING_CORE=0
	; Renders every screen once at boot and dumps the frame buffer over
	; serial (SHOT_BEGIN/SHOT_END), for checking layouts without the panel.
	;-D ES3C35P_UI_SCREENSHOT=1
	; TFT_eSPI is only the drawing engine here (sprites); the panel itself is
	; driven by the quad SPI code in the display driver, so no TFT pins are
	; set. USE_HSPI_PORT keeps TFT_eSPI's register macros on SPI3, away from
	; the panel's bus (and off the address that crashes it on the S3).
	-DUSER_SETUP_LOADED=1
	-DST7796_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DUSE_HSPI_PORT=1
	-DLOAD_GLCD=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
lib_deps =
	https://github.com/takkaO/OpenFontRender#v1.2
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	mathertel/oneButton@^2.6.1
	arduino-libraries/NTPClient@^3.2.1
	bodmer/TFT_eSPI@^2.5.43
lib_ignore =
	HANSOLOminerv2

;--------------------------------------------------------------------

; 4.0" "CYD" with a 320x480 ST7796 panel (ESP32-WROOM-32E, 4MB flash, CH340,
; XPT2046 touch on the panel's SPI bus). Same chip and mining setup as
; ESP32-2432S028R; runs the Pulse theme at 480x320
; (src/drivers/displays/esp32_4in_st7796DisplayDriver.cpp).
; Not in default_envs; build it explicitly:
;   pio run -e ESP32-4in-ST7796 -t upload
[env:ESP32-4in-ST7796]
platform = espressif32@6.6.0
