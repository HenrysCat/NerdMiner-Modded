# Builds every board, runs the host unit tests when there are some, and
# publishes the web flasher:
#   - every push and pull request: build all boards (keeps them compiling)
#   - push to main: the flasher on GitHub Pages gets the new build
#   - a tag v*: same, plus a GitHub release with the .bin files
# GitHub Pages must be set to "GitHub Actions" once (Settings > Pages > Source).
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  envs:
    name: List boards
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: Boards from platformio.ini
        shell: python
        run: |
          import configparser, json, os
          # Environments that are not boards, or that do not build on main
          # (han_m5stack: std::chrono error, known).
          SKIP = {"native", "han_m5stack"}
          c = configparser.ConfigParser(strict=False, interpolation=None)
          c.read("platformio.ini")
          envs = [s[4:] for s in c.sections() if s.startswith("env:") and s[4:] not in SKIP]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("envs=%s\n" % json.dumps(envs))
              f.write("tests=%s\n" % ("true" if c.has_section("env:native") else "false"))
          print(len(envs), "boards:", ", ".join(envs))

  tests:
    name: Unit tests
    needs: envs
    if: needs.envs.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native

  build:
    name: ${{ matrix.env }}
    needs: envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.envs.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe gives the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio
      - name: Build
        run: pio run -e "${{ matrix.env }}"
      - name: Pack for the flasher
        run: python tools/webflasher/pack.py "${{ matrix.env }}" packed "$(git describe --tags --always)"
      - uses: actions/upload-artifact@v4
        with:
          name: board-${{ matrix.env }}
          path: packed/
          retention-days: 14

  publish:
    name: Web flasher and release
    needs: build
    # Boards that failed to build are left out; the others are published.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release
      pages: write      # GitHub Pages
      id-token: write   # GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: board-*
          path: site
          merge-multiple: true
      - name: Flasher page
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python tools/webflasher/site.py site "$(git describe --tags --always)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            site/*_factory.bin
            site/*_firmware.bin
